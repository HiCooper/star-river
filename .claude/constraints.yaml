version: 1
constraints:
  - name: no_circular_deps
    description: "模块间不得循环依赖"
    check: "go vet ./..."
    severity: error; auto_fix: true; scope: ["hydra-pay/", "hydra-wall/"]
  - name: payment_idempotency
    description: "所有支付/退款接口必须实现幂等性，使用 idempotency_key 防重复"
    check: "manual"
    severity: error; auto_fix: false; scope: ["hydra-pay/"]
  - name: no_sensitive_data_in_logs
    description: "日志中不得包含卡号、CVV、完整手机号等敏感信息"
    check: "cd hydra-pay && gitleaks detect --no-git 2>/dev/null || echo 'gitleaks not installed'"
    severity: error; auto_fix: true; scope: ["hydra-pay/", "hydra-wall/"]
  - name: transaction_atomicity
    description: "支付状态变更必须是原子的，扣款和状态更新必须在同一事务中"
    check: "manual"
    severity: error; auto_fix: false; scope: ["hydra-pay/"]
  - name: no_new_channel_without_adr
    description: "新增支付渠道必须记录架构决策"
    check: "manual"
    severity: error; auto_fix: false
  - name: channel_failover_must_be_tested
    description: "支付渠道降级/故障切换逻辑必须有对应的测试覆盖"
    check: "manual"
    severity: warning; auto_fix: true; scope: ["hydra-pay/"]
  - name: no_hardcoded_secrets
    description: "不得在代码中硬编码 API Key、密钥或证书路径"
    check: "cd hydra-pay && gitleaks detect --no-git 2>/dev/null || true"
    severity: error; auto_fix: true
anti_goals:
  - "不要引入新的支付网关 SDK — 渠道对接使用自研适配层"
  - "不要直接操作数据库 — 所有数据访问通过 Repository 接口"
  - "不要引入微服务拆分 — 当前阶段保持支付核心的单体架构"
