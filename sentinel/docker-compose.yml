version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra_secret
      POSTGRES_DB: sentinel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  platform:
    build:
      context: ./platform
    ports:
      - "8084:8082"
    environment:
      PORT: "8082"
      GIN_MODE: debug
      DATABASE_URL: postgres://hydra:hydra_secret@postgres:5432/sentinel?sslmode=disable
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      - postgres

  ai-engine:
    build:
      context: ./ai-engine
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://platform:8082

volumes:
  pgdata:
