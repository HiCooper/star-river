name: Hydra-Pay CI

on:
  push:
    branches: [main]
    paths:
      - "hydra-pay/**"
  pull_request:
    branches: [main]
    paths:
      - "hydra-pay/**"
  workflow_dispatch:

jobs:
  go-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-pay/service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: hydra-pay/service
          args: --timeout 5m

  go-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-pay/service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: unit tests
        run: go test ./... -short -count=1 -race

  go-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-pay/service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./cmd/server

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build docker image
        run: docker build -t hydra-pay-service ./hydra-pay/service

  js-sdk-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-pay/sdk/js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: npm install
      - run: npm test

  go-sdk-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hydra-pay/sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./... -count=1
